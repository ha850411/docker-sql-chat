model_list:
  - model_name: gpt-3.5-turbo
    litellm_params:
      model: gemini/gemini-flash-latest
      api_key: os.environ/GEMINI_API_KEY
  
  # 將備用 Key 定義為另一個獨立的項目，使用相同的 model_name
  - model_name: gpt-3.5-turbo
    litellm_params:
      model: gemini/gemini-flash-latest
      api_key: os.environ/GEMINI_API_KEY_1

router_settings:
  enable_cooldown: true
  cooldown_time: 30
  num_retries: 5
  timeout: 30
  allow_retries: true
  retry_on_all_errors: true
  # 建議加入 routing_strategy，預設通常是 simple-shuffle (隨機)
  # routing_strategy: "simple-shuffle" 